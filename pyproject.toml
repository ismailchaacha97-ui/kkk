[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daytrader"
version = "0.1.0"
description = "NautilusTrader-powered day-trading research toolkit: intraday data, ORB/VWAP strategies, risk sizing, backtests and reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nautilus_trader==1.221.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
daytrader = "daytrader.cli:main"

[tool.setuptools.packages.find]
include = ["daytrader*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
